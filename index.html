<script>
const data = JSON.parse(document.getElementById('data').textContent);
const element = id => document.getElementById(id);
const formatNumber = new Intl.NumberFormat('ko-KR');
const formatDate = value => [value.slice(0,4), value.slice(4,6), value.slice(6,8)].join('.');
element('product').textContent = data.product + ' · 물품식별번호 ' + data.id;
element('period').textContent = '표본 내 요청일 ' + data.dates.map(formatDate).join(' ~ ');
element('agencies').textContent = formatNumber.format(data.agencyCount) + '곳';
element('requests').textContent = formatNumber.format(data.requestCount) + '건';
element('quantity').textContent = formatNumber.format(data.quantity) + '개';

function render() {
 const sort = element('sort').value;
 const rows = [...data.agencies].sort((a, b) =>
  Number(b[sort]) - Number(a[sort]) || Number(b.date) - Number(a.date) || a.name.localeCompare(b.name, 'ko')
 );
 for (const key of ['date', 'count', 'quantity']) {
  const header = element(key + '-head');
  if (key === sort) header.setAttribute('aria-sort', 'descending');
  else header.removeAttribute('aria-sort');
 }
 const fragment = document.createDocumentFragment();
 for (const row of rows) {
  const tr = document.createElement('tr');
  for (const value of [row.name, formatDate(row.date), formatNumber.format(row.count) + '건', formatNumber.format(row.quantity) + '개']) {
   tr.insertCell().textContent = value;
  }
  fragment.append(tr);
 }
 element('rows').replaceChildren(fragment);
}
element('sort').addEventListener('change', render);
render();
</script>
